# 桌面安装包：macOS（dmg/zip，arm64+x64）、Windows（nsis 安装器 x64+arm64、portable x64）、
# Linux（AppImage/deb arm64+x64、tar.gz x64）。
#
# - 推版本标签（与 publish.yml 同规则，如 2.1.0 / 2.1.1-beta1）：三平台构建后发 GitHub Release
#   （标签含 "-" 的标为 prerelease）。
# - 手动触发（Actions 页 Run workflow）：只构建，产物在本次运行的 Artifacts 里下载。
#
# 未签名：macOS 首次打开需右键「打开」，Windows SmartScreen 需「仍要运行」。
name: Desktop

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: write # 创建 Release

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 标签与 package.json 版本一致性
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v="$(node -p "require('./package.json').version")"
          if [ "$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::标签 $GITHUB_REF_NAME 与 package.json 版本 $v 不一致"
            exit 1
          fi
      - run: pnpm run build:app
      - name: 下载 media-bridge（随安装包内置）
        run: node scripts/fetch-media-bridge.mjs --platform ${{ matrix.platform }}
      - name: electron-builder
        run: pnpm exec electron-builder --${{ matrix.platform }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: webwallgl-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: WebWallGL ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: artifacts/*
